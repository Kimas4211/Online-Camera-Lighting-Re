<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Luma · 实时人脸补光工作室</title><link rel="stylesheet" href="style.css"><body><header><a class="brand" href="#">◒ <b>luma</b><span>LIGHT STUDIO</span></a><div class="project">未命名光影实验 <span> / 本地工作区</span></div><button id="capture">↓ 导出画面</button></header><div class="layout"><aside class="left"><div class="label">工作区</div><button class="nav selected">◉ &nbsp; 实时补光</button><div class="label space">场景图层</div><button class="layer selected" id="selectLight">☀ &nbsp; 主光源 <small>01</small></button><div class="layer">▣ &nbsp; 摄像头画面</div><div class="privacy"><i>◈</i><b>你的画面，只属于你</b><p>视频与人脸数据仅在浏览器内处理，不上传、不保存。</p></div></aside><main><div class="toolbar"><div><b>人像画布</b><span id="mode">演示模式</span></div><div><button id="compare">◐ 原图对比</button><button id="mirror" class="active">⇆ 镜像</button></div></div><div class="workspace"><div class="stage" id="stage"><canvas id="view" width="960" height="720"></canvas><div class="badge" id="track">● 演示模型 · 拖动试试</div><button id="orb" aria-label="拖动灯光，方向键微调" title="拖动灯光，方向键微调"><span>✦</span><em>主光源</em></button><div id="welcome"><div class="cameraIcon">◎</div><h1>让光，随你而动。</h1><p>开启摄像头，拖动光球，探索属于你的光影。</p><button id="start" class="primary">开启摄像头 ↗</button><small>仅请求摄像头权限 · 不使用麦克风</small></div><div class="corners"></div></div><div class="hint"><span>✥</span> 拖动光球改变光线方向 <i>·</i> 右侧调整光线质感</div></div><footer><span id="status">◌ 准备就绪</span><span>本地渲染 <b>•</b> WebGL</span><button id="stop" disabled>关闭摄像头</button></footer></main><aside class="right"><div class="tabs"><b>灯光属性</b><span>LIGHT 01</span></div><section><div class="lightTitle"><div>☀</div><p><b>主光源</b><small>可移动点光源</small></p><button id="toggle" class="active">开启</button></div></section><section><div class="label">灯光预设</div><div class="presets"><button data-preset="soft" class="active">柔和日光</button><button data-preset="warm">暖调人像</button><button data-preset="cool">冷调电影</button><button data-preset="side">侧光塑形</button></div></section><section><label>亮度 <output id="powerVal">65%</output></label><input id="power" type="range" min="0" max="150" value="65"><label>柔和度 <output id="softVal">55%</output></label><input id="soft" type="range" min="0" max="100" value="55"><label>灯光距离 <output id="depthVal">60%</output></label><input id="depth" type="range" min="10" max="150" value="60"><label>灯光颜色 <input id="color" type="color" value="#fff1db"></label><div class="swatches"><button style="--sw:#fff1db" data-color="#fff1db" aria-label="日光"></button><button style="--sw:#ffb970" data-color="#ffb970" aria-label="暖光"></button><button style="--sw:#a9cbff" data-color="#a9cbff" aria-label="冷光"></button><button style="--sw:#e5bcff" data-color="#e5bcff" aria-label="紫光"></button><span id="hex">#FFF1DB</span></div></section><section><label>显示人脸网格 <input type="checkbox" id="mesh"></label><button id="reset" class="reset">↺ 重置灯光</button></section><div class="note"><b>关于当前效果</b><p>基于人脸三维关键点计算补光，保留原始光照。不模拟投射阴影或遮挡。</p></div></aside></div><video id="video" autoplay playsinline muted hidden></video><div id="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
